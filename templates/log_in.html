<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>

            body{
                background-color: rgb(26, 33, 56);
                background-image: url('/resources/log-in_bg_right.jpg');
                background-position: center;
                background-size: contain;
                display: grid;
                grid-template-columns: 4fr 6fr;
                grid-template-rows: 100%;
                height:100vh;
            }
            .bodyLeft{
                display: grid;
                grid-template-areas:    'blank1 blank1 blank1' 
                                        'blank2 frame blank4'
                                        'blank3 blank3 blank3';
                grid-template-columns: .5fr 5fr .5fr;
                grid-template-rows: .2fr 10fr .5fr;
            }

            .bodyLeft .frame .door{
                background-size:100% 100%;
                background-position: center;
                background-repeat: no-repeat;
                backdrop-filter: blur(5px);
                grid-area : door;
                background-color: rgba(255, 255, 255, 0.38);
                border:2px solid rgb(248, 248, 248,0.12); 
                border-radius: 8px;
                display:flex;
                flex-direction: column;

            }
            .bodyLeft .frame{
                display: grid;
                grid-area: frame;
                grid-template-areas:    'blank1 blank1 blank1'
                                        'blank2 door blank3'
                                        'blank4 blank4 blank4';
                
                grid-template-columns: 20px 1fr 20px;
                grid-template-rows: 20px 1fr 20px;

            }
        

            
        
        .bodyRight{
            display: grid;
            grid-template-areas: 'blank1 blank1 blank1'
                        'blank2 card blank3' 
                        'blank4 loginButton blank5' 
                        'blank6 blank6 blank6' ;

                        
            grid-template-rows: .4fr 5fr 1fr 1fr;
            grid-template-columns: 1fr 4fr .5fr;
        }
        
        .card{
            background-color: rgba(255, 255, 255, 0.38);
            border:2px solid rgb(248, 248, 248,0.12);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            grid-area: card;
            overflow: hidden;
            backdrop-filter: blur(5px);
            overflow-y: auto;
            scroll-behavior: smooth;
            transition: 0.3s ease;
        }

        .card::-webkit-scrollbar {
           display: none;
        }

        .card label{
            display: flex;
            flex-direction: column;
            padding: 4%;
            
        }
        .card label .inputs{
            
            background: transparent;
            border: 2px solid rgb(255, 253, 253,0.12);
            border-radius: 100px;
            height: 30px;
            padding: 10px;
            margin: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            color:black;
        }
        .loginButton{
            border: 2px solid black;
            grid-area:loginButton;
            justify-self:center;
            height:40%;
            width: 20%;
            border-radius: 20px;
            margin: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            background-color: rgba(242, 239, 39, 0.827);
            transition: 0.3s ease;
        }
        .loginButton:hover{
            background-color: rgba(232, 228, 25, 0.555);
            scale:1.1;
        }
        .admin{
            justify-self: center;
            align-self:center;
            background-color: rgb(0, 163, 19,.50);
            backdrop-filter: blur(5px);
            border:2px solid rgb(0, 163, 19,.80);
            border-radius: 8px;
            height: 8%;
            width: 20%;
            font-size: large;
            transition: 0.3s ease;
        }
        .admin:hover{
            background-color:rgba(2, 63, 9, 0.8);
            scale:1.1;

        }
        .door {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .glass{
            color: rgb(0, 0, 0,.50);
            font-size: large;
        }
        .mark{
            background-color: rgba(0, 255, 30, 0.5);
            backdrop-filter: blur(5px);
            border:2px solid rgb(0, 255, 19,.80);
            border-radius: 8px;
            font-size: large;
        }
        .card:hover{
            scale: 1.1;
        }

    </style>
</head>
<body>
    <div class="bodyLeft">

        <div class='frame'>
            <div class="door" id="door">
                <button class='admin'id="admin">Admin</button>
            </div>
        </div>
    
    </div>
    <div class="bodyRight">



        <div class="card">
            <label for="userName">
                <h1>Enter User Name</h1>
                <input type="text" id="userName" placeholder="Enter User Name" class="inputs">
            </label>
            <label for="password">
                <h1>Enter Password</h1>
                <input type="text" id="password" placeholder="Enter password " class="inputs">
            </label>
        </div>

        <button class="loginButton" id = 'logIN'>LOG IN</button>

    </div>
    <script>
        console.log('log_in.html');
        const userName = document.getElementById('userName');
        const password = document.getElementById('password');
        const logInButton = document.getElementById('logIN');
        
        logInButton.addEventListener('click',async ()=>{
            const data = await fetch('/auth/check_Employee',{
                method:'POST',
                headers:{
                    'Content-Type' : 'application/json'
                },
                body:JSON.stringify({
                    'userName' : userName.value,
                    'password' : password.value
                })
            })
            const resp = await data.json();
            console.log(resp)
            console.log(resp.Data);
            door.innerHTML='<h1>wrong credentials</h1>';
            alert(resp)
            if(resp.valid){ 

            const door = document.getElementById('door')
            door.innerHTML=`<h1 class = 'glass'>Welcome ${resp.Data.Employee_Name}<h1>
                <button class='mark'id='markA'>Mark Attendence</button>`;
                
                sessionStorage.setItem('userName',resp.Data.Employee_Name);
                sessionStorage.setItem('userId',(resp.Data.Employee_Id));

                markA = document.getElementById('markA')
                markA.addEventListener('click',async ()=>{
                    const response = await fetch('/attendence/markAttendence',{
                        method:'POST',
                        headers:{'Content-Type' : 'application/json'},
                        body:JSON.stringify({
                            'Employee_Id': sessionStorage.getItem('userId')
                        })
                    })
                    alert(sessionStorage.getItem('userId'));
                    console.log(response)
                    const result = await response.json();
                    console.log('thsi is the result of mark attendence ',result);
                    if(result.sucess){
                        alert('attendence markde successfullt');
                    }
                    else{
                        alert('somthing went wrong');
                    }
                    })
            }
        })

        const admin = document.getElementById('admin')
        admin.addEventListener('click',async ()=>{
            const server = await fetch('/admin/login',{
                        method:'POST',
                        headers:{'Content-Type' : 'application/json'},
                        body:JSON.stringify({
                            'userName': userName.value,
                            'password':password.value
                        })
                    })
                    let response =await server.json()
                    console.log(response)
                    if(response.validation){
                        alert('admin log in sucess full')
                    }
                    else{
                        alert('admin log in fail check credentials')
                    }
                    sessionStorage.setItem('user_id',response.data.User_Id);
                    sessionStorage.setItem('user_name',response.data.User_Name);
                    sessionStorage.setItem('user_status',response.data.User_Status)

                    if(sessionStorage.getItem('user_status') == 'ACTIVE'){
                        window.location.href='/admin/dashboard'
                    }
                })

            
    </script>
    
</body>
</html>
